name: CMake
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        platform:
          - {os: ubuntu-latest, cc: gcc}
          - {os: ubuntu-latest, cc: clang}
          - {os: macos-latest, cc: clang}
          - {os: windows-latest, cc: cl}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Programs built with MSVC's /fsanitize=address load this DLL at startup.
      - name: Add the MSVC AddressSanitizer runtime to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dll = & $vswhere -latest -products * -find 'VC\Tools\MSVC\*\bin\Hostx64\x64\clang_rt.asan_dynamic-x86_64.dll' | Select-Object -Last 1
          if (-not $dll) { throw "MSVC AddressSanitizer runtime not found" }
          Split-Path $dll | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBARO_SANITIZERS=ON -DCMAKE_C_COMPILER=${{ matrix.platform.cc }}
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --timeout 300
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-${{ matrix.platform.os }}-${{ matrix.platform.cc }}-${{ matrix.build_type }}
          path: |
            build/**/Testing/Temporary/**
            build/**/CMakeFiles/CMakeConfigureLog.yaml
            build/**/CMakeFiles/CMakeError.log
  cmake-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cmake: ['3.20.5', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CMake
        shell: bash
        run: |
          if [ '${{ matrix.cmake }}' = latest ]; then
            python -m pip install --upgrade cmake
          else
            python -m pip install 'cmake==${{ matrix.cmake }}'
          fi
      - name: Configure
        run: cmake --preset debug
      - name: Build
        run: cmake --build --preset debug
      - name: Test
        run: ctest --preset debug
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cmake-${{ matrix.cmake }}-logs
          path: out/debug/**/Testing/Temporary/**
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'gcovr==8.6'
      - run: cmake --preset coverage -DCMAKE_C_COMPILER=gcc
      - run: cmake --build --preset coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gcc-coverage
          path: |
            out/coverage/coverage/**
            out/coverage/**/Testing/Temporary/**

name: CMake
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        platform:
          - {os: ubuntu-latest, cc: gcc}
          - {os: ubuntu-latest, cc: clang}
          - {os: macos-latest, cc: clang}
          - {os: windows-latest, cc: cl}
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBARO_SANITIZERS=ON -DCMAKE_C_COMPILER=${{ matrix.platform.cc }}
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-${{ matrix.platform.os }}-${{ matrix.platform.cc }}-${{ matrix.build_type }}
          path: |
            build/**/Testing/Temporary/**
            build/**/CMakeFiles/CMakeConfigureLog.yaml
            build/**/CMakeFiles/CMakeError.log
  cmake-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cmake: ['3.20.5', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CMake
        shell: bash
        run: |
          if [ '${{ matrix.cmake }}' = latest ]; then
            python -m pip install --upgrade cmake
          else
            python -m pip install 'cmake==${{ matrix.cmake }}'
          fi
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cmake-${{ matrix.cmake }}-logs
          path: build/**/Testing/Temporary/**
